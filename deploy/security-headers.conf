# Included in every location: nginx drops server-level add_header in a location that has its own.
# The app uses no inline scripts or styles and loads everything from this origin
# (Vite inlines small font files as data: URIs).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# same-origin, not no-referrer: Sanctum recognises the web app by Origin or Referer, and browsers
# send neither on a same-origin GET under no-referrer (the session would be lost on GET /api/me).
# Other sites still never receive a referrer (so a token in a URL cannot leak through it).
add_header Referrer-Policy "same-origin" always;
# Only effective over HTTPS; harmless otherwise. Set at the TLS terminator if there is one in front.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
