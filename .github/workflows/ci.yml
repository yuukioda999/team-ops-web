name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The API types must be generated from the current team-ops-api OpenAPI file (CLAUDE.md)
      - uses: actions/checkout@v7
        with:
          repository: yuukioda999/team-ops-api
          path: .openapi-src
      - run: npm run gen:api
        env:
          OPENAPI_FILE: .openapi-src/openapi/openapi.yaml
      - run: rm -rf .openapi-src && git diff --exit-code src/api/schema.d.ts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
