name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as the Dockerfile and @types/node
          cache: npm
      - run: npm ci
      # The API types must be generated from the current team-ops-api OpenAPI file (CLAUDE.md)
      - uses: actions/checkout@v7
        with:
          repository: yuukioda999/team-ops-api
          path: .openapi-src
      - run: npm run gen:api
        env:
          OPENAPI_FILE: .openapi-src/openapi/openapi.yaml
      - run: rm -rf .openapi-src && git diff --exit-code src/api/schema.d.ts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The production image: build it, start it, and check the security headers and the log format.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target prod -t team-ops-web:ci .
      - name: Start the image and check what it serves
        run: |
          docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 team-ops-web:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers=$(curl -fsSI http://localhost:8080/login)
          echo "$headers"
          for h in "Content-Security-Policy: default-src 'self'" "X-Frame-Options: DENY" "X-Content-Type-Options: nosniff" "Referrer-Policy: same-origin" "Strict-Transport-Security:"; do
            echo "$headers" | grep -qi "^$h" || { echo "missing header: $h"; exit 1; }
          done
          # The SPA fallback serves index.html for app paths
          curl -fs http://localhost:8080/teams/new | grep -q '<div id="root">'
          # A token in the query string must not reach the access log (D7): verify pages are not logged,
          # and other pages are logged by path only
          curl -fs -o /dev/null "http://localhost:8080/login/verify?token=secret-token-value"
          curl -fs -o /dev/null "http://localhost:8080/login?token=secret-token-value"
          sleep 1
          docker logs web 2>&1 | tee /tmp/web.log
          grep -q "\"GET /" /tmp/web.log # requests are logged at all (app paths appear as /index.html)
          ! grep -q secret-token-value /tmp/web.log
          # A client's own X-Forwarded-For is ignored when it is not the trusted proxy
          curl -fs -o /dev/null -H 'X-Forwarded-For: 203.0.113.99' http://localhost:8080/login
          sleep 1
          ! docker logs web 2>&1 | grep -q '^203.0.113.99 '
      - name: Behind the trusted proxy, the client IP comes from X-Forwarded-For (ADR-0022)
        run: |
          # Requests from the host reach the container from Docker's private range, like Caddy on the server
          docker run -d --name web-proxied -p 8081:8080 -e API_UPSTREAM=http://127.0.0.1:9 -e REAL_IP_FROM=172.16.0.0/12 team-ops-web:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8081/ && break; sleep 1; done
          curl -fs -o /dev/null -H 'X-Forwarded-For: 203.0.113.7' http://localhost:8081/login
          sleep 1
          docker logs web-proxied 2>&1 | tee /tmp/web-proxied.log
          grep -q '^203.0.113.7 ' /tmp/web-proxied.log
      - if: always()
        run: docker rm -f web web-proxied || true
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 本番のサーバーはコミットのハッシュのタグを指定して取ってくる(ADR-0022)
      - name: Push the image
        if: github.ref == 'refs/heads/main'
        run: |
          for tag in latest ${{ github.sha }}; do
            docker tag team-ops-web:ci ghcr.io/${{ github.repository }}:$tag
            docker push ghcr.io/${{ github.repository }}:$tag
          done
